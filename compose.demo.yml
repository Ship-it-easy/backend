name: ship-it-demo

services:
  frontend:
    build:
      context: ../ship-it-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${DEMO_HTTP_BIND:?Set the VPS private IP in .env.demo}:${DEMO_HTTP_PORT:-8080}:80"
    networks:
      - core

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.demo
    command: >-
      sh -c "alembic upgrade head &&
      gunicorn -c conf/gunicorn.conf.py --workers 1 'auth.run:make_app()'"
    depends_on:
      postgres:
        condition: service_healthy
      valhalla:
        condition: service_healthy
    volumes:
      - demo-manifests:/demo-manifests
    networks:
      - core

  postgres:
    image: postgres:13.0-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASS:?Set POSTGRES_PASS in .env.demo}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - core
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:3.9.0
    restart: unless-stopped
    environment:
      tile_urls: ${OSM_PBF_URL:?Set OSM_PBF_URL in .env.demo}
      server_threads: ${VALHALLA_THREADS:-1}
      build_time_zones: "True"
    volumes:
      - valhalla-data:/custom_files
    networks:
      - core
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/status"]
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 90m

volumes:
  postgres-data:
  valhalla-data:
  demo-manifests:

networks:
  core:
    name: ship-it-demo-core
