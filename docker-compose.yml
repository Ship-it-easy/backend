services:
  backend:
    container_name: backend
    env_file:
      - ${ENV_FILE:-.env.docker}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:${BACKEND_PORT}"
    networks:
      - custom
    depends_on:
      postgres:
        condition: service_healthy
      valhalla:
        condition: service_healthy
      nominatim:
        condition: service_healthy
    command: >-
      sh -c "alembic upgrade head &&
      gunicorn -c conf/gunicorn.conf.py 'auth.run:make_app()'"

  postgres:
    container_name: postgres
    image: postgres:13.0-alpine
    env_file:
      - ${ENV_FILE:-.env.docker}
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - custom
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:${POSTGRES_PORT}"

  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    environment:
      tile_urls: ${VALHALLA_TILE_URLS:-${OSM_PBF_URL:-https://download.openstreetmap.fr/extracts/russia/central_federal_district-latest.osm.pbf}}
      server_threads: ${VALHALLA_THREADS:-2}
    volumes:
      - valhalla-data:/custom_files
    ports:
      - "8002:8002"
    networks:
      - custom
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/status"]
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 10m

  nominatim:
    image: mediagis/nominatim:5.3
    environment:
      PBF_URL: ${NOMINATIM_PBF_URL:-${OSM_PBF_URL:-https://download.openstreetmap.fr/extracts/russia/central_federal_district-latest.osm.pbf}}
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:-nominatim}
      THREADS: ${NOMINATIM_THREADS:-2}
    volumes:
      - nominatim-data:/var/lib/postgresql/16/main
    ports:
      - "8080:8080"
    networks:
      - custom
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/status?format=json"]
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 10m

volumes:
  postgres-data:
  valhalla-data:
  nominatim-data:

networks:
  custom:
    driver: bridge
